name: VicProj CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check app || true

      - name: Import check (fumeaza aplicatia se incarca fara erori)
        env:
          JWT_SECRET: ci-test-secret
          ADMIN_PIN_HASH: "$2b$12$abcdefghijklmnopqrstuv"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: python -c "from app.main import app; print('OK: app import reusit')"

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t vicproj-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t vicproj-frontend:ci ./frontend

  # --------------------------------------------------------------------
  # Exemplu deploy pe un VPS prin SSH (activeaza dupa ce ai configurat
  # secretele SSH_HOST, SSH_USER si SSH_PRIVATE_KEY in GitHub -> Settings
  # -> Secrets and variables -> Actions).
  # --------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy pe VPS via SSH (docker compose up)
        if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/vicproj
            git pull origin main
            docker compose pull || true
            docker compose up -d --build

      - name: Deploy dezactivat
        if: ${{ vars.ENABLE_SSH_DEPLOY != 'true' }}
        run: echo "Deploy SSH este dezactivat. Seteaza variabila repo ENABLE_SSH_DEPLOY=true si secretele SSH pentru a-l activa."
