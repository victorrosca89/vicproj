server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style routing: /share/{code} si /?magic_token=... trebuie sa serveasca tot index.html,
    # logica de routare este facuta in JavaScript (vezi app.js).
    location /share/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
